; Library Climate Monitor - ESP32 sensor node
; Build/upload with PlatformIO (VS Code extension or `pio run -t upload`).
; Change `board` to match yours (e.g. lolin_d32, firebeetle32, adafruit_feather_esp32_v2).

[env:esp32]
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit SHT31 Library@^2.2.2
    adafruit/Adafruit Unified Sensor@^1.1.14

build_flags =
    -DCORE_DEBUG_LEVEL=0
